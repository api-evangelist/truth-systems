aid: truth-systems
name: Truth Systems
description: >-
  Truth Systems builds AI governance and hallucination-detection infrastructure
  for regulated industries, with a focus on legal firms. Gateway, its core API
  product, fact-checks LLM-generated text against customer source documents in
  real time - decomposing a claim into statements, retrieving evidence, and
  returning SUPPORTS / REFUTES / NOT_ENOUGH_INFO verdicts with character-level
  evidence spans. Gateway deploys into the customer's own AWS or Azure account
  via Terraform, with a Python SDK. The company also offers Charter (AI
  governance for human users) and Alexandria (agent-focused governance), and is
  backed by Lightspeed Venture Partners.
